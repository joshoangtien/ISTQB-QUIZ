u have been given the following story:\n\nAs a help desk worker\nI want to enter a caller's birth date\nSo the system can display the caller's account information\n\nAs a team, you have developed the following table of acceptance criteria:", "o": ["The security test case should be executed first as it is related to access control", "The test cases are not accepting the test criteria", "The test cases are not being executed in the proper order", "The test cases do not indicate the expected result"], "a": [2], "img": true, "cap": "You have developed the following test cases and will execute them in the specified order:\n1. Enter a valid date and verify that the account retrieved matches the birth date entered.\n2. Enter an invalid date and verify that the error indicates the date is invalid.\n3. Verify that the date prompt is already formatted for the date with xx/xx/xx format.\n4. Enter a valid date and verify that two pages of account information are readable.\n5. Enter a valid date and verify that the response occurs within 2 seconds when the system is under an average load.\nWhat is incorrect about this approach?"}, {"q": "You are working with a geographically and time zone distributed team. It is important that the entire team always have access to the latest test execution information. Which of these is the most appropriate method for communicating that status?", "o": ["Daily stand-up meetings with everyone", "Dashboards connected to the test management and defect management systems that automatically update when a change is made", "Email sent out hourly to all team members with red text for any new issues with a \"must read\" note in the subject line", "Formal test reports issued each week with trend charts and residual defect status information"], "a": [1], "img": false, "cap": ""}, {"q": "As a tester, as part of a V-model project, you are currently executing some tests aimed at verifying if a mobile app asks the user to grant the proper access permissions during the installation process and after the installation process. The requirements specification states that in both cases the app shall ask the user to grant access permissions only to the camera and photos stored on the device. However, you observe that the app also asks the user to grant access permission to all contacts on the device. Consider the following items:\n\n[I]. Test environment\n[II]. Expected result\n[III]. Actual result\n[IV]. Test level\n[V]. Root cause\n\nBased on only the given information, which of the items listed above are you able to correctly specify in a defect report?", "o": ["[I] and [II]", "[II] and [III]", "[II], [III], and [V]", "[I], [IV], and [V]"], "a": [1], "img": false, "cap": ""}, {"q": "Scenario “Big Drop”:\n\nThe management of the company “The Big Drop” has instructed the Product Team to configure the discounts in the sales terminals so that frequent customers receive an additional discount on top of a bulk discount, based on the following table.", "o": ["5 decision rules", "6 decision rules", "32 decision rules", "8 decision rules"], "a": [1], "img": true, "cap": "You must design test cases to represent all POSSIBLE and REAL business scenarios. Test cases should be generated using the input data provided in the table above.\n\nHow many POSSIBLE decision rules can be extracted from the table above?"}, {"q": "In what way does configuration management help the tester?", "o": ["It verifies that the test cases are executed in the correct order", "It ensures that regressions do not occur", "It enforces proper unit testing and measurement", "It uniquely identifies the items to be tested"], "a": [3], "img": false, "cap": ""}, {"q": "Which ONE of the following options is a practice that does NOT TYPICALLY correspond to a shift left approach?", "o": ["Reviewing the specification from the perspective of testing.", "Write the test cases before writing the code and run the code in a test harness during code implementation.", "Using continuous integration (CI) and even better continuous delivery (CD).", "Performing non-functional testing starting at the system test level."], "a": [3], "img": false, "cap": ""}, {"q": "What does the risk level depend on?", "o": ["Risk impact and risk likelihood", "Risk likelihood and risk priority", "Risk impact and risk severity", "Risk priority and risk severity"], "a": [0], "img": false, "cap": ""}, {"q": "The following decision table is used to assist a doctor in determining the drug therapy to prescribe for a patient (aged 6 to 65 years) diagnosed with acute sinusitis. The table consists of three Boolean conditions and six actions.", "o": ["Column 7 represents an impossible situation and thus can be deleted.", "Columns 1 and 3 can be merged into a single column.", "Columns 2, 4, 6 and 8 can be merged into a single column.", "Columns 5 and 7 can be merged into a single column."], "a": [2], "img": true, "cap": ""}, {"q": "A requirement specifies that a certain identifier (ID) must be between 5 and 10 characters long, must contain only alphanumeric characters, and its first character must be a letter. As a tester, you want to apply one-dimensional equivalence partitioning to test this ID. This means that you have to apply equivalence partitioning individually: to the length of the ID, the type of characters contained within the ID, and the type of the first character of the ID.\nWhat is the number of partitions to cover?", "o": ["7", "6", "5", "3"], "a": [0], "img": false, "cap": ""}, {"q": "Which of the following is a valid test objective?", "o": ["Finding the stable areas of the code which do not require testing", "Debugging incidents to determine the cause of the problem", "Finding failures and defects in the test object", "Participating in code reviews to improve scripting skills"], "a": [2], "img": false, "cap": ""}, {"q": "In branch testing, what is the significance of a conditional branch in a software program?", "o": ["It signifies a comment or documentation within the code and it doesn’t indicate a defect.", "It marks a point where the program’s execution will terminate bringing the program to a halt.", "It indicates a decision point where the program can follow different paths based on specific conditions.", "It represents a programming error and therefore a conditional branch should be avoided."], "a": [2], "img": false, "cap": ""}, {"q": "Which of the following statements about retrospectives is TRUE?", "o": ["Only developers and testers should be involved in retrospectives, as involving people in other roles is very likely to prevent developers and testers from having open and constructive discussions that really help identify process improvements.", "Retrospectives can be very effective in identifying process improvements and can also be very efficient and cost-effective especially since, unlike reviews, they do not require any follow-up activities.", "On Agile projects, well-conducted retrospectives at the end of each iteration can help the team reduce and sometimes even eliminate the need for daily stand-up meetings.", "During retrospectives, in addition to identifying relevant process improvements, participants should also consider how to implement these improvements and retain them based on the context of the project, such as the software development lifecycle."], "a": [3], "img": false, "cap": ""}, {"q": "Which of the following statements refers to a good testing practice that applies to all software development lifecycles?", "o": ["Each test level should have its own specific test objectives that should be consistent with the software development lifecycle phase or type of activities it addresses.", "Test analysis and design for any test levels should begin as soon as coding is complete, and all system components are available for testing.", "The most efficient and effective method of conveying information to and within a development team is face-to-face conversation.", "All the tests should be automated and run as part of the continuous integration process with every software change."], "a": [0], "img": false, "cap": ""}, {"q": "A tester created a decision table (DT) given below. While reviewing the DT some of the actions for the given conditions were found to be incorrect. The user is trying to view the profile which of the given conditions has CORRECT action(s) listed?", "o": ["C1", "C2", "C3", "C4"], "a": [1], "img": true, "cap": ""}, {"q": "Which of the following is a testware created during test analysis?", "o": ["\"Steps: 1) enter valid username; 2) enter a correct password; 3) click 'Login'; expected result: the user is logged\"", "\"Check that the user can successfully log in to the application with valid credentials\"", "\"Number of test cases run: 55; number of test cases passed: 35; number of test cases failed: 20\"", "\"When a user enters valid credentials and clicks the 'Login' button, no action occurs, and the user remains on the login page\""], "a": [1], "img": false, "cap": ""}, {"q": "Which of the following statements is TRUE?", "o": ["User acceptance tests are usually automated and aim to verify the acceptance criteria for user stories.", "Acceptance criteria for user stories can include details on data definitions, for example by describing the format, allowed values, and default values for a data item.", "Acceptance criteria for user stories should focus on positive scenarios, while negative scenarios should be excluded.", "Tests derived from acceptance criteria for user stories are not included in any of the four testing quadrants."], "a": [1], "img": false, "cap": ""}, {"q": "Which of the following statements about the test pyramid is TRUE?", "o": ["Each layer of the test pyramid groups tests related to a single non-functional quality characteristic.", "The higher the layer of the test pyramid, the more production code a single automated test within the layer tends to cover.", "The higher the layer of the test pyramid, the more maintainable a single automated test within the layer tends to be.", "The higher the layer of the test pyramid, the more isolated a single automated test within the layer tends to be."], "a": [1], "img": false, "cap": ""}, {"q": "What kind of work products can be examined by reviews?", "o": ["Only work products with a structure against which they can be checked by a tool", "Only work products that can be read and understood", "Only work products that are difficult to interpret by humans", "Only non-executable work products"], "a": [1], "img": false, "cap": ""}, {"q": "Which of the following statements about the shift-left approach is FALSE?", "o": ["The shift-left approach can only be implemented with test automation.", "The shift-left approach in testing is compatible with DevOps practices.", "The shift-left approach can involve security vulnerabilities.", "The shift-left approach can be supported by static analysis tools."], "a": [0], "img": false, "cap": ""}, {"q": "Which of the following is an advantage of the whole team approach?", "o": ["Any person in the team with the right skills can perform any task", "Tasks are assigned to specific team members who will own that task until completion", "Testers have clear ownership of quality and this eliminates confusion and overlap", "Business representatives are not included in the team so they can supply independent assessment during UAT"], "a": [0], "img": false, "cap": ""}, {"q": "Which of the following statements about statement coverage is TRUE?", "o": ["Achieving 90% statement coverage ensures that 90% branch coverage is achieved.", "Achieving 100% statement coverage ensures that no variable within the code has been used without being initialized.", "Achieving 100% statement coverage ensures that 100% branch coverage is achieved.", "Achieving 80% statement coverage ensures that 80% of all executable statements within the code have been exercised."], "a": [3], "img": false, "cap": ""}, {"q": "An anti-intrusion system is battery powered and is activated by pressing the only available button. To deactivate the system, the operator must enter a PIN code. The system will stay in alert mode within a configurable timeout and an alarm bell will ring if the system is not deactivated before the timeout expires. The following state transition diagram describes the behavior of the system:", "o": ["1", "2", "3", "4"], "a": [1], "img": true, "cap": "What is the minimim number of test cases needed to cover every unique sequence of exactly 4 states / 3 transitions starting and ending in the \"Inactive\" state? (note that \"Inactive\" is not a final state in the diagram)."}, {"q": "Which ONE of the following options CANNOT be subjected to static analysis?", "o": ["COTS (Commercial off-the-shelf)", "Source code", "BPMN (Business Process Modeling and Notation) models", "UML (Unified Modeling Language) models"], "a": [0], "img": false, "cap": ""}, {"q": "Which sequence of state transitions is INCORRECT in accordance with the following description?\n\nTo provide for disaster recovery a system (designated as A) has been provided with a backup system (designated as B). Only one of them can be active at a time. When A goes down, B becomes active. When A comes back up then B becomes inactive and A becomes active again. However, when A is down and B also goes down then a message is sent to the system administrator. After this once A comes back up, A becomes active or if B comes up then B becomes Active.", "o": ["A is active and B is inactive A goes down. B becomes active then B goes down. A is made active", "A comes up when B is active and A was down. Now A becomes active and B becomes inactive.", "A is active and B is inactive then A goes down B becomes active.", "A and B are both down then A and B both come back up at the same time A should become the active system and B should be inactive."], "a": [3], "img": false, "cap": ""}, {"q": "Which ONE of the following roles is responsible for mediating, managing time, and generating a safe review environment in which everyone can speak freely?", "o": ["Manager", "Reviewer", "Review leader", "Moderator"], "a": [3], "img": false, "cap": ""}, {"q": "You have just completed a retrospective at the end of a sprint. One of the developers raised an issue with defect reports not containing information about the configuration, data, and system being used when the failure occurred. When this happens, they reject the defect report and the tester has to update it and send it again. This sometimes takes three or four iterations to get all the information on the report. The test team will take this feedback and will improve the detail included in the defect report.\nThis is an example of which type of benefit for testing?", "o": ["Increased test effectiveness / efficiency", "Team bonding and learning", "Improved quality of the test basis", "Increased quality of test cases"], "a": [0], "img": false, "cap": ""}, {"q": "Consider an estimation session in which a six-member Agile team (Memb1,…, Memb6) uses the planning poker technique to estimate a user story (in story points). The team members will use a set of cards with the following values: 1, 2, 3, 5, 8, 13, 21. Below is the outcome of the first round of estimation for this session:\n\nMemb1 = 3, Memb2 = 3, Memb3 = 3,\nMemb4 = 21, Memb5 = 3, Memb6 = 1\n\nWhich of the following answers BEST describes how the estimation session should proceed?", "o": ["The final estimate of the user story in story points is determined by applying the three-point estimation technique with the following input values: most optimistic estimate = 1, most likely estimate = 3, and most pessimistic estimate = 21.", "Further estimation rounds should be performed until all team members will pick the card having the same value: this value will represent the final estimate of the user story in story points.", "The final estimate of the user story in story points is determined by calculating the average value between the most optimistic estimate of 21 story points (Memb4) and the most pessimistic estimate of 1 story point (Memb6).", "Memb6 and Memb4 which have produced the most pessimistic and the most optimistic estimates respectively, should explain the reasons of their choices to stimulate a discussion between all members before proceeding to another estimation round."], "a": [3], "img": false, "cap": ""}, {"q": "What is error guessing?", "o": ["A test technique in which the tester anticipates the mistakes the developer might make, defects they might introduce, and failures that may occur due to these defects", "A test technique in which a tester designs, implements, and executes tests to cover test conditions from a checklist built based on knowledge about how software fails", "A test estimation technique in which testers use their knowledge and experience to estimate the effort needed to fix problems in the test process due to testers’ mistakes", "A type of software testing that identifies vulnerabilities, threats, and risks in a system to ensure its resources are protected from unauthorized access and malicious attacks"], "a": [0], "img": false, "cap": ""}, {"q": "Your company has been working in a waterfall lifecycle model. They have now decided to implement DevOps and will be using CI/CD. Which of the following is a change that will be required from the testing team?", "o": ["No change is required; the current approach will still be applicable", "There will be additional emphasis on test automation to supply continuous testing", "Additional time will be needed to analyze requirements and design test cases", "There will be a need for less technical testers because developers will handle all the technicall testing"], "a": [1], "img": false, "cap": ""}, {"q": "Which of the following BEST illustrates the benefit of using test coverage tools?", "o": ["Ease of configuration management", "More objective assessment", "Better defect prevention", "Dependency on tool vendor"], "a": [1], "img": false, "cap": ""}, {"q": "You are working on creating test cases for a user story.\n\nAs a customer, I want to be able to book an ISTQB exam for a particular date, so that I can find choose my time slot and pay the correct amount, including discounts, if any.\n\nThe acceptance criteria for this:\n1. The dates shown should be from the current date to 2 years in future.\n2. Initially there should be 10 timeslots available for each day, 1 hour each starting at 8 AM GMT.\n3. Maximum 5 persons should be able to select a time slot after which that time slot should become unavailable.\n4. First timeslot should have a 10% discount.\n\nWhich of the following is the BEST example of a test case for this user story?", "o": ["Logon to the site and book an exam for the 8 AM (GMT) timeslot. Expected result: You should get 10% discounted price. Change the time to any other timeslot. Expected result: Discount should be removed.", "Logon to the site. Book an exam for the current date. Expected result: timeslots should be shown. Change the time to any other date prior to the selected date. Expected result: New slot should become visible.", "Logon to the site. Book 5 exams for the current date. Expected result: Exams should be booked. Book 6th timeslot for the same date. Expected result: The exam should be booked but no discount should be given.", "Logon to the site. Expected result: Default 8 AM (GMT) timeslot should be selected. Change the time to any other timeslot Expected result. New slot should be booked."], "a": [0], "img": false, "cap": ""}, {"q": "What is the difference between confirmation testing and regression testing?", "o": ["Confirmation testing verifies that specific defects have been fixed, while regression testing ensures that recent changes have not introduced new defects in existing functionality.", "Confirmation testing is performed by developers as unit or unit integration testing, while regression testing is performed by testers as system integration, system, or acceptance testing.", "There is no difference. These two terms are synonymous.", "Confirmation testing verifies that the test object works correctly under expected conditions, while regression testing verifies the system's robustness with unexpected or incorrect data."], "a": [0], "img": false, "cap": ""}, {"q": "Which of the following statements is CORRECT about error guessing?", "o": ["Error guessing depends on the developers guessing what mistakes testers might make and miss the possible defects", "While reviewing the test cases, testers have to make guess about the kind of mistakes test cases might contain", "Error guessing doesn't make use of past failures as past failures are not indicators of correct defects", "Fault attacks are an example of a technique for implementing error guessing"], "a": [3], "img": false, "cap": ""}, {"q": "Match test activities (1)-(4) with related tasks (P)-(S):\n(1) Test analysis\n(2) Test completion\n(3) Test implementation\n(4) Test execution\n\n(P) Defining test conditions\n(Q) Reporting defects\n(R) Creating change requests for unresolved defects\n(S) Creating test cases", "o": ["1P, 2R, 3S, 4Q", "1S, 2R, 3P, 4Q", "1S, 2Q, 3P, 4R", "1P, 2Q, 3S, 4R"], "a": [3], "img": false, "cap": ""}, {"q": "Which of the following statements is CORRECT about the value added by a tester to release planning?", "o": ["The tester writes acceptance criteria", "The tester assesses the testability of the user stories", "The tester breaks down user stories into smaller testing tasks", "The tester estimates the testing effort for individual iterations"], "a": [1], "img": false, "cap": ""}, {"q": "If you are responsible for test analysis and design what is your primary role in your team?", "o": ["Business analyst", "Test manager", "Developer", "Tester"], "a": [3], "img": false, "cap": ""}, {"q": "Which TWO are examples of entry criteria for system testing of a food order app? (Choose two.)", "o": ["All functional tests for the payment process are automated", "A test basis describing the business rules for discounts is available", "All smoke tests of the registering and logging features passed", "The appropriate functional tests cover all use cases", "There are no critical and at most 3 major defects unresolved"], "a": [2, 4], "img": false, "cap": ""}, {"q": "Consider the following list of possible benefits of retrospectives (A to D):\n\n[A] Team bonding and learning\n[B] Increased test effectiveness/efficiency\n[C] Improved quality of the test basis\n[D] Better cooperation between development and testing\n\n… and the list of possible characteristics of retrospectives (1 to 4) that enable achieving these benefits:\n1. The possibility of implementing suggestions for process improvement\n2. The opportunity to raise problems and propose points for improvement\n3. The regular review and optimization of the collaboration between team members\n4. The possibility of addressing and solving deficiencies in the content and quality of the requirements\n\nWhich ONE of the following options presents the BEST mapping between benefits and characteristics from retrospectives?", "o": ["A1 – B4 – C3 – D2", "A2 – B1 – C4 – D3", "A4 – B3 – C2 – D1", "A3 – B2 – C1 – D4"], "a": [1], "img": false, "cap": ""}, {"q": "Your team is developing a new functionality for an employee management system, a Simple Reporting feature. The team is tasked with estimating the test effort required to test this feature.\n\nThe team used the standard three-point estimation method to provide the predicted effort.\n\nThe team came up with the following estimates:\n• in the optimistic scenario, the testing can be done in 1 hour\n• in the most likely scenario, the testing can be done in 2 hours\n• in the worst-case scenario, the testing can be done in 9 hours\n\nWhat is the team's final estimation of the test effort?", "o": ["4 hours", "2 hours", "3 hours", "6 hours"], "a": [2], "img": false, "cap": ""}, {"q": "As a result of the joint evaluation of a product version with the customer, it has been concluded that it would be appropriate to retrieve an earlier version of the product and carry out a benchmark. Depending on the result, further development will be carried out based on the current version or the retrieved version.\n\nWhich mechanism, process, and/or technique will allow the specific version (including the testing work products) of a given software product to be restored?", "o": ["Defect management", "Configuration management", "Change management", "Risk management"], "a": [1], "img": false, "cap": ""}, {"q": "What does the “absence-of-defects fallacy” refer to in software development?", "o": ["The idea that fixing defects is NOT important to meeting user needs", "The need for constant system quality assurance and improvements", "A misconception that software verification is unnecessary", "The belief that thoroughly testing all requirements guarantees system success"], "a": [3], "img": false, "cap": ""}, {"q": "Which black-box technique should be used to verify different responses of the system, depending on its current conditions or previous history?", "o": ["Use case testing", "Decision table testing", "State transition testing", "Equivalence partitioning"], "a": [2], "img": false, "cap": ""}, {"q": "Which of the following statements about the testing quadrants is TRUE?", "o": ["The higher the number of the testing quadrant, the more important the tests associated with this quadrant are.", "Automated acceptance tests produced during BDD and ATDD are classified in quadrant Q2.", "Exploratory tests are classified in quadrant Q3, and they are usually included in a continuous integration process.", "Automated unit tests produced during TDD are classified in quadrant Q4 as they are technology facing."], "a": [1], "img": false, "cap": ""}, {"q": "Which of the following answers describes a reason for adopting experience-based testing techniques?", "o": ["Experience-based test techniques provide more systematic coverag re consistency and control across IT environments"], "a": [0], "img": false, "cap": ""}, {"q": "Testing can be seen as a destructive activity. Which of the following generic skills will help a tester overcome this barrier?", "o": ["Analytical thinking", "Communicating with empathy", "Curiosity", "Tool knowledge"], "a": [1], "img": false, "cap": ""}, {"q": "Consider the following statements (I to V) about software testing:\nI. Can be applied to non-executable work products.\nII. Can be used to measure performance efficiency.\nIII. Can lead to the detection of defects.\nIV. Can find defects directly.\nV. Can identify unexpected behaviors caused by potential defects.\n\nWhich ONE of the following options is the list that characterizes static tests the BEST?", "o": ["Statements I, III, and IV", "Statements II, IV, and V", "Statements I, II, and IV", "Statements II, III, and V"], "a": [0], "img": false, "cap": ""}, {"q": "You have been given the following story:\nAs a help desk worker\nI want to enter a caller's birth date\nSo the system can display the caller's account information\nAs a team, you have developed the following table of acceptance criteria:", "o": ["The security test case should be executed first as it is related to access control", "The test cases should contain all steps required for execution, including navigation information and SQL statements required to perform the verification", "The test cases are not being executed in the proper order", "The test cases do not indicate the expected result"], "a": [2], "img": true, "cap": "You have developed the following test cases and will execute them in the specified order:\n1. Enter a valid date and verify that the account retrieved matches the birth date entered.\n2. Enter an invalid date and verify that the error indicates the date is invalid.\n3. Verify that the date prompt is already formatted for the date with xx/xx/xx format.\n4. Enter a valid date and verify that two pages of account information are readable.\n5. Enter a valid date and verify that the response occurs within 2 seconds when the system is under an average load.\nWhat is incorrect about this approach?"}, {"q": "Consider the following list of activities (I to V):\nI. Test design\nII. Test planning\nIII. Review test basis\nIV. Be a facilitator of a peer review\nV. Test monitoring and control.\n\nWhich ONE of the following options identifies the activities that the test management role is MAINLY focused on?", "o": ["Activities III, IV, and V", "Activities II and V", "Activities I and V", "Activities I, III, and IV"], "a": [1], "img": false, "cap": ""}, {"q": "Consider the following statements about acceptance test levels (I to V):\n\nI. Acceptance test levels focus on validating and demonstrating readiness for deployment.\nII. Acceptance test levels must be performed by an independent test team.\nIII. Acceptance test levels often require specific support, such as test harnesses.\nIV. Acceptance test levels ideally should be performed by the intended users.\nV. Acceptance test levels use component specifications as the test basis for the system.\n\nWhich ONE of the following options contains the statements (I – V) that MOST ACCURATELY characterize acceptance test levels?", "o": ["Statements I, III, and V", "Statements II, IV, and V", "Statements II and V", "Statements I and IV"], "a": [3], "img": false, "cap": ""}, {"q": "What is one potential benefit of using a test automation tool?", "o": ["The quality of defects will improve", "Ease of access to statistics about test progress", "Disk space is not required to track versions of test artifacts", "Less network traffic generated"], "a": [1], "img": false, "cap": ""}, {"q": "Which ONE of the following elements is TYPICALLY part of the test plan?", "o": ["The budget and schedule for the test project.", "A detailed analysis of the defects found and their causes.", "A detailed report on the test results after the test project is completed.", "A list of test logs mentation and hence the status need not be documented and shared in a formal manner"], "a": [2], "img": false, "cap": ""}, {"q": "Which type of report will MOST LIKELY contain information about testing planned for the next period?", "o": ["Test progress report", "Defect report", "Test completion report", "Risk register"], "a": [0], "img": false, "cap": ""}, {"q": "An e-commerce site accepts credit cards for processing the payment. The payment processing form has a field for the amount of money to be deducted. The minimum amount of money that can be processed is $10. The credit cards have a limit of $5,000 (Five Thousand). Assume that only integers can be accepted as inputs. Which of the following set of boundary values will you choose for EFFICIENT testing for the amount of money that can be spent?", "o": ["1", "9, 10, 5000, 5001", "10, 5000", "9, 10, 11, 4999, 5000, 5001"], "a": [1], "img": false, "cap": ""}, {"q": "Which of the following statements about impact of DevOps on testing is CORRECT?", "o": ["DevOps helps shift focus of operations towards better deployment planning.", "DevOps helps shift focus from development to release management.", "DevOps helps eliminate manual testing completely by enforcing automation.", "DevOps helps bring focus on testing of non-functional characteristics."], "a": [3], "img": false, "cap": ""}, {"q": "Which of the following is a typical potential risk of using test automation tools?", "o": ["Reduced feedback times regarding software quality compared to manual testing.", "Reduced test execution times compared to manual testing.", "Reduced repeatability and consistency of tests compared to manual testing.", "Underestimation of effort required to maintain test scripts."], "a": [3], "img": false, "cap": ""}, {"q": "Which of the following statements is CORRECT about White-box testing?", "o": ["White-box testing helps find defects because they can be used to measure statement coverage", "White-box testing helps find defects because it aracteristics of sequential models; iv and v are characteristics of iterative and incremental models", "iii and iv are characteristics of sequential models; and i, ii and v are characteristics of iterative and incremental models", "i and iv are characteristics of sequential models; ii, iii and v are characteristics of iterative and incremental models", "ii and iv are characteristics of sequential models; i in and v are characteristics of iterative and incremental models"], "a": [0], "img": false, "cap": ""}, {"q": "Scenario “Happy Tomatoes”\n\nAn intelligent application for agricultural use incorporates temperature sensors located at different points of an enclosure. The sensors measure and record the temperature at regular intervals and extract the statistical values for these measurements. These values include the average daily temperature.\n\nA new variety of tomatoes is currently being grown and the “World Organization for Happy Tomatoes” has established temperature ranges related to vegetative development.\n\nWhen the system establishes that the average temperature is within a specific range, it emits a value that will be used to monitor and control the crop.", "o": ["(7, 8, 21, 22, 29, 30)", "(7, 8, 22, 23, 29, 30)", "(6, 7, 8, 21, 22, 29, 31)", "(6, 7, 21, 22, 29, 30)"], "a": [2], "img": true, "cap": "Using the Boundary Value Analysis technique (in its two-point variant), identify the set of input values that provides the HIGHEST coverage."}, {"q": "Determining the schedule for each testing activity and test milestones for a test project, using activity estimates, available resources, and other constraints is a typical task performed during:", "o": ["Test execution", "Test design", "Test analysis", "Test planning"], "a": [3], "img": false, "cap": ""}, {"q": "You are testing web application software that allows a person to use their travel points to make flight and hotel reservations.\nWhen the user logs into the software (username/password) they are presented with a set of options. From that set of options, they can pick the following:\n1. View points balance\n2. Make flight reservation\n3. Make hotel reservation\nFrom the login page, they can log in successfully or might fail and need to try again. Once they login successfully they can go to either the view points, flight reservation or hotel reservation page.\nWhich of the following is the correct list of the transitions (a transition is shown as >) that should be tested, assuming that the test ends when a reservation state is reached.", "o": ["Points > Reservation", "Login > Points, Points > Flight, Points > Hotel", "Login > Login, Login > Points, Login > Flight, Login > Hotel, Points > Flight, Points > Hotel", "Login > Login, Login > Points, Login > Flight, Login > Hotel, Flight > Hotel, Hotel > Flight, Flight > Login, Hotel > Login"], "a": [2], "img": false, "cap": ""}, {"q": "Which of the following statements about checklist-based testing is TRUE?", "o": ["Checklist-based testing is a technique for managing the review meeting that can be applied in those reviews where the use of checklists is mandatory, as is often the case in formal reviews.", "Checklist-based testing is a review technique that can be used in a formal review process where reviewers, during individual review, try to detect issues within the work product based on a checklist.", "In checklist-based testing, using checklists at a high level of detail is more likely to produce test cases that are easier to reproduce than those using checklists at a low level of detail.", "Checklists used in checklist-based testing should be reviewed periodically for updates as, over time, test cases designed using the same checklist may become less effective at finding defects."], "a": [3], "img": false, "cap": ""}, {"q": "Which of the following is an example of scenario-oriented acceptance criteria?", "o": ["The user should be able to provide three inputs to test the product - the Al model to be tested, the data used {"q": "Which of the following types of tools is BEST suited for determining source code compliance with the guidelines provided by a coding standard?", "o": ["Containerization tool", "Fault seeding tool", "Static analysis tool", "Test data preparation tool"], "a": [2], "img": false, "cap": ""}, {"q": "Which of the following best suggests the need for maintenance testing?", "o": ["Failures found in alpha testing", "The initial release of the software", "Changing requirements during pre-deployment activities", "Adding a new feature to an existing system"], "a": [3], "img": false, "cap": ""}, {"q": "A document describes the test procedures that have been derived for the identified test sets. Among other things, the order in which the test cases in the corresponding test set are to be executed according to the dependencies described by preconditions and postconditions is specified.\nThis document is a typical work product produced as part of:", "o": ["Test design", "Test analysis", "Test implementation", "Test monitoring and control"], "a": [2], "img": false, "cap": ""}, {"q": "Which of the following is an example of a shift left?", "o": ["Performing non-functional testing using functional test cases", "Monitoring system performance after the release", "Using Acceptance Test-Driven Development", "Participating in retrospectives"], "a": [2], "img": false, "cap": ""}, {"q": "For each test case to be executed, the following table specifies its dependencies and the required configuration of the test environment for running such test case:", "o": ["TC4, TC3, TC2, TC1, TC5.", "TC1, TC5, TC4, TC3, TC2.", "TC4, TC3, TC2, TC5, TC1.", "TC4, TC1, TC5, TC2, TC3."], "a": [0], "img": true, "cap": ""}, {"q": "Which\nONE of the following statements would you expect to be the MOST DIRECT\nadvantage of the whole-team approach?", "o": ["Capitalizing on the combined skills of business representatives, testers, and developers working together to contribute to project success.", "Reducing the involvement of business representatives because of enhanced communication and collaboration between testers and developers.", "Avoiding requirements misunderstandings that may not have been detected until dynamic testing when they are more expensive to fix.", "Having an automated build and test process, at least once a day, that detects integration errors early and quickly."], "a": [0], "img": false, "cap": ""}, {"q": "You work on a project where the executed test set achieved 100% statement coverage.\n\nWhat is the consequence of this fact?", "o": ["Each executable statement with a defect had to be exercised at least once", "The test set triggered no failures in the tested code", "All requirements related to the code under test are met", "Each decision outcome in the code had to be evaluated both for true and false"], "a": [0], "img": false, "cap": ""}];
const pad=n=>String(n).padStart(3,'0');
const QS=D.map((d,i)=>({id:i,q:d.q,o:d.o,a:d.a,img:d.img?'images/q'+pad(i+1)+'.png':null,cap:d.cap||''}));
const KEY='istqb-1-202-v2',IKEY='istqb-install-later',L='ABCDEFG';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let st={ans:{},order:QS.map(q=>q.id),pos:0,filter:'all'};
try{const s=JSON.parse(lsGet(KEY)||'null');if(s&&Array.isArray(s.order)){if(s.order.length===QS.length)st=Object.assign(st,s);else if(s.ans)st.ans=s.ans}}catch(e){}
let view=[],pending=[],armed=null;
const $=id=>document.getElementById(id);
const save=()=>lsSet(KEY,JSON.stringify(st));
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const isRight=(q,sel)=>sel.length===q.a.length&&q.a.every(x=>sel.includes(x));
const status=id=>{const s=st.ans[id];if(!s)return null;return isRight(QS[id],s)?'ok':'bad'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

window.imgFail=function(img){
  const f=img.closest('figure');if(!f)return;
  f.innerHTML='<div class="imgmiss">Chưa có ảnh <code>'+esc(img.getAttribute('src'))+'</code>.</div>';
};

function buildView(keepId){
  view=st.order.filter(id=>st.filter==='all'||(st.filter==='todo'&&!st.ans[id])||(st.filter==='bad'&&status(id)==='bad'));
  if(keepId!=null&&view.includes(keepId))st.pos=view.indexOf(keepId);
  if(st.pos>=view.length)st.pos=Math.max(0,view.length-1);
}
function stats(){
  const ids=Object.keys(st.ans);let ok=0;ids.forEach(id=>{if(status(+id)==='ok')ok++});
  const done=ids.length,bad=done-ok,pct=done?Math.round(ok*100/done):null;
  $('sDone').textContent=done+'/'+QS.length;$('sOk').textContent=ok;$('sBad').textContent=bad;
  $('sPct').textContent=pct==null?'–':pct+'%';
  $('barFill').style.width=(pct||0)+'%';
  $('barFill').style.background=pct==null?'var(--accent)':pct>=65?'var(--ok)':'var(--bad)';
  $('barText').textContent=pct==null?'Tỉ lệ đúng trên số câu đã làm':(pct>=65?'Trên ngưỡng đậu':'Dưới ngưỡng đậu')+' · '+ok+'/'+done+' câu đúng';
}
function render(){
  stats();
  ['All','Todo','Bad'].forEach(f=>$('f'+f).setAttribute('aria-pressed',st.filter===f.toLowerCase()));
  const card=$('card');
  if(!view.length){
    card.innerHTML='<div class="empty">'+(st.filter==='bad'?'Chưa có câu sai nào. Làm thêm vài câu rồi quay lại đây để ôn.':'Đã làm hết các câu. Chuyển sang "Câu sai" để ôn lại.')+'</div>';
    updateBar();renderGrid();return;
  }
  const id=view[st.pos],q=QS[id],sel=st.ans[id],done=!!sel,multi=q.a.length>1;
  let h='<div class="qhead"><span class="qno">Câu '+(id+1)+'</span><span>'+(st.pos+1)+' / '+view.length+(st.filter!=='all'?' trong bộ lọc':'')+'</span></div>';
  h+='<p class="qtext">'+esc(q.q)+'</p>';
  if(q.img)h+='<figure class="qimg"><a href="'+q.img+'" target="_blank" rel="noopener"><img src="'+q.img+'" alt="Hình minh hoạ câu '+(id+1)+'" decoding="async" onerror="imgFail(this)"></a><figcaption>Bấm vào ảnh để xem cỡ lớn</figcaption></figure>';
  if(q.cap)h+='<p class="qtext">'+esc(q.cap)+'</p>';
  if(multi&&!done)h+='<div class="hint">Chọn '+q.a.length+' đáp án ('+pending.length+'/'+q.a.length+')</div>';
  h+='<div class="opts">';
  q.o.forEach((o,i)=>{
    let c='opt';
    if(done){if(q.a.includes(i))c+=' ok';else if(sel.includes(i))c+=' bad'}
    else if(pending.includes(i))c+=' sel';
    h+='<button class="'+c+'" data-i="'+i+'" id="opt'+i+'"'+(done?' disabled':'')+'><span class="k">'+L[i]+'</span><span class="t">'+esc(o)+'</span></button>';
  });
  h+='</div>';
  if(done){
    const r=isRight(q,sel);
    h+='<div class="fb '+(r?'ok':'bad')+'" role="status"><strong>'+(r?'Chính xác.':'Chưa đúng.')+'</strong>';
    if(!r)h+='<span class="ans">Đáp án đúng: '+q.a.map(x=>L[x]).join(', ')+' · '+esc(q.a.map(x=>q.o[x]).join(' / '))+'</span>';
    h+='</div>';
    
  }
  h+='<div class="nav"><button class="btn navbtn" id="prev"'+(st.pos===0?' disabled':'')+'>← Câu trước</button>';
  h+='<button class="btn navbtn'+(done?' primary':'')+'" id="next"'+(st.pos>=view.length-1?' disabled':'')+'>Câu tiếp →</button>';
  if(done)h+='<button class="btn" id="redo">Làm lại câu này</button>';
  h+='<span class="spacer"></span><span class="keys"><kbd>1</kbd>–<kbd>5</kbd> chọn · <kbd>←</kbd><kbd>→</kbd> chuyển câu</span></div>';
  card.innerHTML=h;
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  $('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
  if($('redo'))$('redo').onclick=()=>{delete st.ans[id];pending=[];save();render()};
  updateBar();renderGrid();
}
function updateBar(){
  const n=view.length;
  $('mPos').textContent=n?(st.pos+1)+' / '+n:'0 / 0';
  $('mPrev').disabled=!n||st.pos===0;
  $('mNext').disabled=!n||st.pos>=n-1;
  $('mNext').classList.toggle('primary',!!(n&&st.ans[view[st.pos]]));
}
function renderGrid(){
  $('gridTitle').textContent='Danh sách câu ('+(st.filter!=='all'?view.length+' trong bộ lọc':QS.length)+')';
  const cur=view[st.pos];
  $('grid').innerHTML=view.map((id,i)=>{const s=status(id);return '<button class="cell'+(s?' '+s:'')+(id===cur?' cur':'')+'" data-p="'+i+'" aria-label="Câu '+(id+1)+'">'+(id+1)+'</button>'}).join('');
  $('grid').querySelectorAll('.cell').forEach(b=>b.onclick=()=>{st.pos=+b.dataset.p;pending=[];save();render();closeSheet();toCard(true)});
}
function toCard(force){
  const r=$('card').getBoundingClientRect();
  if(force||r.top<0)window.scrollBy({top:r.top-12,behavior:reduceMotion?'auto':'smooth'});
}
function pick(i){
  const id=view[st.pos],q=QS[id];if(!q||st.ans[id])return;
  if(q.a.length>1){
    pending=pending.includes(i)?pending.filter(x=>x!==i):pending.concat(i);
    if(pending.length<q.a.length){render();return}
    st.ans[id]=pending.slice();pending=[];
  }else st.ans[id]=[i];
  save();render();
}
function go(d){const n=st.pos+d;if(n<0||n>=view.length)return;st.pos=n;pending=[];save();render();toCard(false)}
function setFilter(f){const cur=view[st.pos];st.filter=f;st.pos=0;pending=[];buildView(f==='all'?cur:null);save();render()}

/* Bottom sheet (phones/tablets) */
const side=$('side'),backdrop=$('backdrop');
function openSheet(){side.classList.add('open');backdrop.classList.add('open');document.body.classList.add('lock');const c=side.querySelector('.cur');if(c)c.scrollIntoView({block:'center'})}
function closeSheet(){side.classList.remove('open');backdrop.classList.remove('open');document.body.classList.remove('lock')}
$('mPos').onclick=openSheet;$('sheetClose').onclick=closeSheet;backdrop.onclick=closeSheet;
$('mPrev').onclick=()=>go(-1);$('mNext').onclick=()=>go(1);
matchMedia('(max-width: 900px)').addEventListener('change',e=>{if(!e.matches)closeSheet()});

/* Swipe left/right on the question card */
let tx=0,ty=0,tt=0;
$('card').addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;tt=Date.now()},{passive:true});
$('card').addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;if(Date.now()-tt<600&&Math.abs(dx)>70&&Math.abs(dy)<45)go(dx<0?1:-1)},{passive:true});

$('fAll').onclick=()=>setFilter('all');$('fTodo').onclick=()=>setFilter('todo');$('fBad').onclick=()=>setFilter('bad');
$('shuffle').onclick=()=>{
  const o=QS.map(q=>q.id);
  if($('shuffle').dataset.on==='1'){st.order=o;$('shuffle').dataset.on='0';$('shuffle').textContent='Xáo thứ tự'}
  else{for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}st.order=o;$('shuffle').dataset.on='1';$('shuffle').textContent='Thứ tự gốc'}
  st.pos=0;pending=[];buildView();save();render();
};
$('reset').onclick=()=>{
  const b=$('reset');
  if(armed){clearTimeout(armed);armed=null;st.ans={};st.pos=0;pending=[];b.textContent='Làm lại từ đầu';buildView();save();render();return}
  b.textContent='Bấm lần nữa để xoá';armed=setTimeout(()=>{armed=null;b.textContent='Làm lại từ đầu'},3000);
};
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='Escape'){closeSheet();return}
  if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
  else if(/^[1-7]$/.test(e.key)){const q=QS[view[st.pos]];const i=+e.key-1;if(q&&i<q.o.length)pick(i)}
});

/* Add to home screen */
const UA=navigator.userAgent;
const isIOS=/iPhone|iPad|iPod/i.test(UA)||(/Macintosh/.test(UA)&&navigator.maxTouchPoints>1);
const isMobile=isIOS||/Android|Mobi/i.test(UA)||matchMedia('(pointer: coarse)').matches;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const SHARE_ICON='<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
let deferredPrompt=null,forceBanner=false;
function updateInstall(){
  const banner=$('install'),openBtn=$('installOpen'),btn=$('installBtn'),msg=$('installMsg');
  if(!isMobile||isStandalone()){banner.hidden=true;openBtn.hidden=true;return}
  btn.hidden=true;
  if(isIOS){
    msg.innerHTML='Trong Safari, bấm '+SHARE_ICON+' <b>Chia sẻ</b> rồi chọn <b>Thêm vào MH chính</b> (Add to Home Screen).';
  }else if(deferredPrompt){
    msg.textContent='Mở như app, toàn màn hình, làm đề được cả khi mất mạng.';btn.hidden=false;
  }else if(!window.isSecureContext||location.protocol==='file:'){
    msg.textContent='Cần mở trang qua link HTTPS (host trên server) thì mới cài được lên màn hình chính.';
  }else{
    msg.textContent='Mở menu trình duyệt (⋮) rồi chọn "Thêm vào màn hình chính" hoặc "Cài đặt ứng dụng".';
  }
  const later=lsGet(IKEY)==='1'&&!forceBanner;
  banner.hidden=later;openBtn.hidden=!later;
}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;updateInstall()});
addEventListener('appinstalled',()=>{deferredPrompt=null;$('install').hidden=true;$('installOpen').hidden=true});
$('installBtn').onclick=async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  try{await deferredPrompt.userChoice}catch(e){}
  deferredPrompt=null;updateInstall();
};
$('installLater').onclick=()=>{lsSet(IKEY,'1');forceBanner=false;updateInstall()};
$('installOpen').onclick=()=>{forceBanner=true;updateInstall();window.scrollTo({top:0,behavior:reduceMotion?'auto':'smooth'})};

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

if(st.order.join()!==QS.map(q=>q.id).join()){$('shuffle').dataset.on='1';$('shuffle').textContent='Thứ tự gốc'}
buildView();render();updateInstall();
</script>
</body>
</html>
