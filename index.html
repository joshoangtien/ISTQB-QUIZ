<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luyện đề ISTQB CTFL</title>
<meta name="description" content="202 câu luyện đề ISTQB CTFL, chọn là biết đúng sai ngay">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2350a8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18202b" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ISTQB">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
/* Layout: answer-sheet card with a sticky question map on desktop; on phones the map becomes a bottom sheet and navigation moves to a thumb bar */
:root{
  --bg:#eef1f5; --paper:#ffffff; --ink:#18212e; --muted:#5b6676; --line:#d6dce5;
  --accent:#2350a8; --accent-soft:#e3eaf8; --on-accent:#ffffff;
  --ok:#1f7a4a; --ok-soft:#e1f3e8; --bad:#b3362c; --bad-soft:#fbe6e3; --warn:#9a6a00; --warn-soft:#fbf0d6;
  --shade:rgb(16 24 40 / .4);
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --bar:66px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151d; --paper:#18202b; --ink:#e6ebf2; --muted:#9aa6b6; --line:#2c3746;
  --accent:#7ea6f2; --accent-soft:#1f2c44; --on-accent:#0e1520;
  --ok:#5fcf8f; --ok-soft:#163223; --bad:#f08a7e; --bad-soft:#3a1d1a; --warn:#e2b44d; --warn-soft:#332a14;
  --shade:rgb(0 0 0 / .55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151d; --paper:#18202b; --ink:#e6ebf2; --muted:#9aa6b6; --line:#2c3746;
  --accent:#7ea6f2; --accent-soft:#1f2c44; --on-accent:#0e1520;
  --ok:#5fcf8f; --ok-soft:#163223; --bad:#f08a7e; --bad-soft:#3a1d1a; --warn:#e2b44d; --warn-soft:#332a14;
  --shade:rgb(0 0 0 / .55); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:1180px;margin:0 auto;display:grid;gap:16px;
  padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
h1{font-family:var(--f-read);font-weight:600;font-size:1.6rem;line-height:1.2;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;margin:4px 0 0}
.stats{display:flex;gap:20px;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.stat{display:grid;line-height:1.2}
.stat b{font-size:1.25rem;font-weight:600}
.stat span{font-family:var(--f-ui);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)}

.install{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;background:var(--paper);border:1px solid var(--accent);border-radius:12px;padding:12px 14px}
.install img{width:48px;height:48px;border-radius:11px;display:block}
.install-tx{display:grid;gap:2px;font-size:.88rem;min-width:0}
.install-tx strong{font-size:.95rem}
.install-tx span{color:var(--muted)}
.install-tx svg{width:15px;height:15px;vertical-align:-2px;stroke:var(--accent)}
.install-act{grid-column:1 / -1;display:flex;gap:8px;justify-content:flex-end}

.layout{display:grid;gap:20px;grid-template-columns:minmax(0,1fr) 300px;align-items:start}
main{display:grid;gap:14px;min-width:0}

.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .25s}
.bar em{position:absolute;top:0;bottom:0;left:65%;width:2px;background:var(--ink);opacity:.45}
.barcap{display:flex;justify-content:space-between;gap:8px;font-size:.75rem;color:var(--muted);margin-top:4px}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:7px 12px;font-size:.85rem;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
.spacer{flex:1}

.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px clamp(16px,3vw,28px);display:grid;gap:16px;min-width:0}
.qhead{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-num);font-size:.8rem;color:var(--muted)}
.qhead .qno{color:var(--accent);font-weight:600}
.qtext{font-family:var(--f-read);font-size:1.06rem;line-height:1.6;white-space:pre-line;margin:0;max-width:70ch;overflow-wrap:anywhere}
.hint{font-size:.85rem;color:var(--accent);font-weight:600}
.qimg{margin:0;display:grid;gap:6px;justify-items:start;min-width:0}
.qimg a{display:block;max-width:100%}
.qimg img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.qimg figcaption{font-size:.75rem;color:var(--muted)}
.imgmiss{padding:10px 12px;border:1px dashed var(--line);border-radius:8px;font-size:.86rem;color:var(--muted);overflow-wrap:anywhere}
.imgmiss a{color:var(--accent);font-weight:600}
.imgmiss code{font-family:var(--f-num);font-size:.8rem}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 12px;cursor:pointer;line-height:1.45}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}}
.opt:active:not(:disabled){background:var(--accent-soft)}
.opt .k{font-family:var(--f-num);font-weight:600;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line);font-size:.8rem}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:var(--paper);border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:var(--paper);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{border-radius:10px;padding:12px 14px;font-size:.92rem;display:grid;gap:6px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb strong{font-size:1rem}
.fb .ans{color:var(--ink);overflow-wrap:anywhere}
.note{background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn);padding:8px 12px;border-radius:6px;font-size:.86rem}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.keys{font-size:.75rem;color:var(--muted)}
.keys kbd{font-family:var(--f-num);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:.72rem}
.empty{color:var(--muted);text-align:center;padding:30px 0}

.side{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;overscroll-behavior:contain;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;align-content:start}
.side-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.side-head h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0;font-weight:600}
.sheet-close{display:none}
.grab{display:none}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.75rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);background:var(--paper)}
.legend i.ok{background:var(--ok-soft);border-color:var(--ok)}
.legend i.bad{background:var(--bad-soft);border-color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:5px}
.cell{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:.75rem;height:32px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--muted);cursor:pointer;padding:0}
.cell.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:600}
.cell.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent;font-weight:600}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink)}
.backdrop{display:none}
.mbar{display:none}

/* Tablet + phone: single column, map becomes a bottom sheet, thumb bar for navigation */
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .app{padding-bottom:calc(var(--bar) + 24px + env(safe-area-inset-bottom,0px))}
  .side{position:fixed;top:auto;left:0;right:0;bottom:0;z-index:40;max-height:75vh;border-radius:16px 16px 0 0;border-bottom:0;
    padding-top:10px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s;box-shadow:0 -8px 30px var(--shade)}
  .side.open{transform:none;visibility:visible;transition:transform .25s ease,visibility 0s}
  .grab{display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 2px}
  .sheet-close{display:inline-flex}
  .grid{grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
  .cell{height:40px;font-size:.8rem}
  .backdrop{display:block;position:fixed;inset:0;z-index:39;background:var(--shade);opacity:0;pointer-events:none;transition:opacity .2s}
  .backdrop.open{opacity:1;pointer-events:auto}
  .mbar{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:var(--paper);border-top:1px solid var(--line);
    padding-top:9px;padding-bottom:max(9px,env(safe-area-inset-bottom,0px));
    padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .mbar .btn{min-height:46px;font-size:.92rem}
  .mbar .pos{font-family:var(--f-num);font-variant-numeric:tabular-nums;min-width:96px;border-radius:999px}
  .card .navbtn,.keys{display:none}
  .nav:not(:has(#redo)){display:none}
}
@media (max-width:560px){
  .app{gap:14px;padding-top:max(14px,env(safe-area-inset-top,0px))}
  h1{font-size:1.32rem}
  .stats{width:100%;justify-content:space-between;gap:10px}
  .stat b{font-size:1.1rem}
  .tools .seg{flex:1 1 100%}
  .seg button{flex:1;padding:10px 6px}
  .tools .btn{flex:1;min-height:40px}
  .tools .spacer{display:none}
  .card{padding:18px 16px;gap:14px;border-radius:10px}
  .qtext{font-size:1rem}
  .opt{min-height:50px;padding:12px}
}
@media (display-mode: standalone){ .sub .web-only{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>Luyện đề ISTQB CTFL</h1>
      <p class="sub">Bộ đề 1-202 · chọn là biết đúng sai ngay</p>
    </div>
    <div class="stats">
      <div class="stat"><b id="sDone">0</b><span>Đã làm</span></div>
      <div class="stat ok"><b id="sOk">0</b><span>Đúng</span></div>
      <div class="stat bad"><b id="sBad">0</b><span>Sai</span></div>
      <div class="stat"><b id="sPct">–</b><span>Tỉ lệ</span></div>
    </div>
  </header>

  <section class="install" id="install" hidden aria-label="Cài ứng dụng">
    <img src="icons/icon-192.png" alt="">
    <div class="install-tx"><strong>Thêm vào màn hình chính</strong><span id="installMsg"></span></div>
    <div class="install-act">
      <button class="btn" id="installLater">Để sau</button>
      <button class="btn primary" id="installBtn" hidden>Cài đặt</button>
    </div>
  </section>

  <div class="layout">
    <main>
      <div>
        <div class="bar" aria-hidden="true"><i id="barFill" style="width:0"></i><em></em></div>
        <div class="barcap"><span id="barText">Tỉ lệ đúng trên số câu đã làm</span><span>Đậu: 65%</span></div>
      </div>
      <div class="tools">
        <div class="seg" role="group" aria-label="Lọc câu">
          <button id="fAll" aria-pressed="true">Tất cả</button>
          <button id="fTodo" aria-pressed="false">Chưa làm</button>
          <button id="fBad" aria-pressed="false">Câu sai</button>
        </div>
        <span class="spacer"></span>
        <button class="btn" id="installOpen" hidden>Cài app</button>
        <button class="btn" id="shuffle">Xáo thứ tự</button>
        <button class="btn danger" id="reset">Làm lại từ đầu</button>
      </div>
      <article class="card" id="card"></article>
    </main>

    <aside class="side" id="side" aria-label="Danh sách câu">
      <div class="grab" aria-hidden="true"></div>
      <div class="side-head"><h2 id="gridTitle">Danh sách câu</h2><button class="btn sheet-close" id="sheetClose">Đóng</button></div>
      <div class="legend"><span><i></i>Chưa làm</span><span><i class="ok"></i>Đúng</span><span><i class="bad"></i>Sai</span></div>
      <div class="grid" id="grid"></div>
    </aside>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>
<nav class="mbar" aria-label="Chuyển câu">
  <button class="btn" id="mPrev">← Trước</button>
  <button class="btn pos" id="mPos" aria-label="Mở danh sách câu">0 / 0</button>
  <button class="btn" id="mNext">Tiếp →</button>
</nav>

<script>
const D=[{"q": "Which of the following is an advantage of the whole team approach?", "o": ["It helps avoid the risk of tasks associated with a user story not moving through the Agile task board at an acceptable rate during an iteration.", "It helps team members understand the current status of an iteration by visualizing the amount of work left to do compared to the time allotted for the iteration.", "It helps the whole team be more effective in test case design by requiring all team members to master all types of test techniques.", "It helps team members develop better relationships with each other and make"], "a": [3], "img": false, "cap": ""}, {"q": "Which of the following provides two defined risk response actions to help control product risk?", "o": ["Deny risk, Mitigate risk by testing", "Accept risk, Abandon risk", "Abandon risk, Delay risk", "Transfer risk, Accept risk"], "a": [3], "img": false, "cap": ""}, {"q": "Which\nONE of the following options BEST characterizes the Behavior-Driven\nDevelopment (BDD) approach?", "o": ["Expresses the desired behavior of an application with test cases written in a simple form of natural language that is easy to understand by stakeholders — usually using the Preconditions/Input Values/Process/Output Values/Postconditions format. Test cases are then automatically translated into executable tests.", "Expresses the desired behavior of an application with test cases written in a simple form of natural language that is easy to understand by stakeholders — usually using the Given/When/Then format. Test cases are then automatically translated into executable tests.", "Derives tests from acceptance criteria as part of the system design process. Tests are written before the part of the application is developed to satisfy the tests. Tests will persist as automated tests to ensure code maintainability in future adaptions/refactoring.", "Derives tests from acceptance criteria as part of the system design process. Tests are written before the part of the application is developed to satisfy the tests. Tests may persist as automated tests to ensure the code quality in future adaptions/refactoring."], "a": [1], "img": false, "cap": ""}, {"q": "An application is subjected to a constant load for an extended period of time as part of a performance test. While running this test, the response time of the application steadily slows down, which results in a requirement not being met. This slowdown is caused by a memory leak where the application code does not properly release some of the dynamically allocated memory when it is no longer needed. Which of the following statements is TRUE?", "o": ["The slowdown is a failure while the memory leak is a defect.", "The slowdown is a defect while the memory leak is an error.", "The slowdown is an error, the memory leak is a defect.", "The slowdown is a defect; the memory leak is a failure."], "a": [0], "img": false, "cap": ""}, {"q": "Scenario “Happy Tomatoes”\n\nAn intelligent application for agricultural use incorporates temperature sensors located at different points of an enclosure. The sensors measure and record the temperature at regular intervals and extract the statistical values for these measurements. These values include the average daily temperature.\n\nA new variety of tomatoes is currently being grown and the “World Organization for Happy Tomatoes” has established temperature ranges related to vegetative development.\n\nWhen the system establishes that the average temperature is within a specific range, it emits a value that will be used to monitor and control the crop.", "o": ["(7, 10, 21, 40)", "(8, 10, 25, 40)", "(7, 10, 25, 29)", "(7, 10, 25, 40)"], "a": [3], "img": true, "cap": "Using the equivalence partitioning technique, identify the set of input values that provides the HIGHEST coverage."}, {"q": "You are getting ready to test software that will be used to dispatch spa pool technicians.\nYou have decided to use a decision table to determine when chemicals will be needed and when maintenance functions should be performed. You have been given the following requirements:\n\n1. Spa pools need chemicals checked and added once a week.\n2. Spa pool filters must be cleaned once a month.\n3. Technicians should add chemicals and clean filters for an emergency maintenance call.\n\nYou have created the conditions part of the decision table:", "o": ["1 is correct", "2 is correct", "3 is correct", "4 is correct"], "a": [2], "img": true, "cap": "Given this information, which of the following is the correct set of actions indicated by this decision table?"}, {"q": "Which of the following provides two defined risk response actions to help control product risk?", "o": ["Deny risk, Cancel risk", "Accept risk, Abandon risk", "Abandon risk, Delay risk", "Transfer risk, Accept risk"], "a": [3], "img": false, "cap": ""}, {"q": "Which of\nthe following is a typical test objective?", "o": ["To fix defects efficiently and effectively", "To ensure the software is free of defects", "To verify that the software meets specified requirements", "To confirm that all possible input combinations have been tested"], "a": [2], "img": false, "cap": ""}, {"q": "Which\nONE of the following options identifies the perspectives through which a\ncollective authorship process generates a shared vision of user stories?", "o": ["Product owner, development, and testing", "Business, architecture, and testing", "Business, development, and testing", "Business, development, and acceptance testing"], "a": [2], "img": false, "cap": ""}, {"q": "Consider a program that computes the factorial of a number (n). From the specifications you know that:\n\n• If n < 0, a message \"Value out of range” must be issued\n• If 0 ≤ n ≤ 100, the program calculates the factorial and returns the number\n• If 100 < n ≤ 200 message \"Value out of range\" must be issued\n\nWhich of the following statements about the equivalence partitions is CORRECT?", "o": ["There are 3 partitions - one for negative numbers, one for numbers up to 100 and the last one for numbers up to 200", "The requirements are not correct because the partitions are overlapping", "The equivalence partitions cannot be determined for this question because the error message for two partitions is exactly same", "The equivalence partitions cannot be determined for this question because the factorial of numbers close to 200 will be very large"], "a": [1], "img": false, "cap": ""}, {"q": "Which of the following is an example of how retrospectives can be used for process improvement?", "o": ["Retrospectives lead to increased project budget", "Retrospectives allow for a quick resolution of technical debt", "Retrospectives improve the quality of the test basis", "Retrospectives facilitate discussions about new product features"], "a": [2], "img": false, "cap": ""}, {"q": "Which of the following is an example of a test work product?", "o": ["Test plan", "Test platform selection", "Code base", "Tool selection"], "a": [0], "img": false, "cap": ""}, {"q": "Which\nONE of the following options MOST ACCURATELY describes branch testing?", "o": ["In branch testing, the coverage items are executable statements. The aim is to design test cases that exercise statements in the code until an acceptable level of coverage is achieved, expressed as a percentage.", "In branch testing, the coverage items are control flow transfers between decisions, and the aim is to design test cases to exercise flow transfers in the code until an acceptable level of coverage is achieved. Coverage is measured as the number of branches exercised by the test cases divided by the total number of branches expressed as a percentage.", "In branch testing, the coverage items are branches, and the aim is to design test cases to exercise branches in the code until an acceptable level of coverage is achieved. Coverage is measured as the number of branches exercised by the test cases divided by the total number of branches expressed as a percentage.", "In branch testing, the coverage items are executable decisions. The aim is to design test cases that exercise statements in the code until an acceptable level of coverage is achieved. Coverage is expressed as a percentage."], "a": [2], "img": false, "cap": ""}, {"q": "Which of the following statements about white-box testing is FALSE?", "o": ["Static testing can benefit from using code-related white-box test techniques during code reviews.", "White-box testing allows suggesting test cases for increasing coverage levels which are based on objective measures.", "Achieving full code coverage for a component or a system ensures that it has been fully tested.", "Black-box testing can benefit from using code-related white-box test techniques to increase confidence in the code."], "a": [2], "img": false, "cap": ""}, {"q": "In a review which of the following is the responsibility of the manager?", "o": ["Performing detailed review based on past experience", "Organizing the logistics of the review meeting", "Ensuring that sufficient time is available for review", "Measuring the performance of each reviewer"], "a": [2], "img": false, "cap": ""}, {"q": "Which of the following is the BEST example of whole team approach?", "o": ["Anyone can perform a task they are capable of", "Sharing same physical workspace is a must", "Testing is the responsibility of the entire team", "Developers should depend on the business analysts as there is no distinction between testers and developers"], "a": [2], "img": false, "cap": ""}, {"q": "User Story: As a member of the “Agnotoly” association, I want to be able to pay the association’s dues through an automatic payment method so that I can forget about payment deadlines.\n\nAcceptance Criteria:\n• The member can only pay with “Agnosis Master” credit card.\n• The member must register their cell phone number.\n• The member must register the credit card in the association’s payment system.\n• The member must select one of the following credit card payment methods: monthly or annual.\n• For the payment system to proceed with the transaction, the member must accept the terms and conditions applicable to the selected payment method (monthly or annual payment).\n• If the member accepts the terms and conditions, the payment system sends a message to the member’s mobile/cell phone with a one-time password and prompts the member to enter the one-time password.\n• The payment method is registered in the association’s payment system once the one-time key sent by the payment system is verified.\n• Once the payment method is registered, the association’s payment system will charge the member on the first business day of the following month.\n\nRemark:\n\nThe payment method registration is a transactional process; therefore, if the acceptance criteria 1 through 7 are not met, the payment system will revert to its previous state and will not maintain any information that may have been entered.\n\nIn the test cycle that has just ended, the following objectives have been achieved:\n• Members of the association have been able to pay association dues with the credit card.\n• Dues payments have been made on a monthly basis and for more than a year since the initial payment.\n\nWhich ONE of the following options identifies the acceptance criteria that has NOT been fully covered during the above test cycle?", "o": ["Acceptance criteria 8 has not been fully covered during the above test cycle.", "Acceptance criteria 4 has not been fully covered during the above test cycle.", "All acceptance criteria have been fully covered during the above test cycle.", "Acceptance criteria 6 has not been fully covered during the above test cycle."], "a": [0], "img": false, "cap": ""}, {"q": "You have been given the following test cases for execution. You have been told that security and usability are the highest priorities respectively for this banking application.\nWhat is the proper execution order for these test cases? 1. Update a customer’s account balance\n2. Query a customer’s account balance\n3. Delete a request for a paper statement\n4. Change the font size on the page to improve readability\n5. Create a new payee in a customer’s automatic bill pay list", "o": ["3,1,5,2,4", "1,2,5,4,3", "1,3,5,2,4", "4,3,1,2,5"], "a": [1], "img": false, "cap": ""}, {"q": "A typical generic skill required for the role of tester is the ability to:", "o": ["Take on the role of developer to meet challenging project deadlines.", "Assume leadership aimed at imposing decisions on the rest of the team.", "Use tools to make the execution of repetitive testing tasks more efficient.", "Determine the corrective actions to get a test project on track in case of deviations from the test plan."], "a": [2], "img": false, "cap": ""}, {"q": "Categorize these risks into project risks and product risks.\n\n(i) Unforeseen technical difficulties, such as integrating with third-party APIs for payment or delivery tracking, could slow down progress\n(ii) Sensitive customer information, such as payment details and addresses, may be exposed due to insufficient security measures\n(iii) Uncontrolled additional feature requests or unclear requirements may lead to delays and budget overruns\n(iv) Limited availability of skilled developers, testers, or designers could hinder the timely delivery of the product\n(v) Confusing navigation may lead to user dissatisfaction, causing a high churn rate", "o": ["(i), (ii), and (iv) are product risks; (iii) and (v) are project risks", "(ii) and (v) are product risks; (i), (iii), and (iv) are project risks", "(iii) and (v) are product risks; (i), (ii), and (iv) are project risks", "(ii) and (iv) are product risks; (i), (iii), and (v) are project risks"], "a": [1], "img": false, "cap": ""}, {"q": "Which\nONE of the following statements BEST applies checklist-based testing?", "o": ["Checklists should contain general guidelines to ensure that all aspects of the software are covered.", "Checklists should contain specific test conditions that can be individually and directly checked.", "Checklists should primarily consist of automated test cases to maximize efficiency.", "Checklists should be used exclusively for functional testing, as they are unsuitable for non-functional testing."], "a": [1], "img": false, "cap": ""}, {"q": "How is branch coverage determined?", "o": ["By taking the number of branches in the code that have been tested and dividing that by the number of total branches in the code", "By taking the number of branches in the code on one path that has been tested and dividing that number by the total paths through the code", "By taking the number of statements in the code and dividing those by the number of branches that have been tested", "By counting the number of branches in the code that have been tested"], "a": [0], "img": false, "cap": ""}, {"q": "Given some statements about independence of testing\n\ni. Independence is a replacement for familiarity with the code.\nii. Independence helps remove the biases produced because of own work.\niii. Similar kind of failures can be detected by anyone.\niv. Assumptions by different people are different revealing weaknesses.\n\nWhich of the following CORRECTLY represents the benefits?", "o": ["ii and iv", "iii and iv", "i and iii", "i and iv"], "a": [0], "img": false, "cap": ""}, {"q": "Which of the following about typical information found within a test plan is FALSE?", "o": ["The need to temporarily have additional test personnel available for specific test phases and/or test activities.", "The conditions that must be met in order for the test execution activities to be considered completed.", "The list of the product risks which have not been fully mitigated at the end of test execution.", "The conditions that must be met for part of all the planned activities to be suspended and resumed."], "a": [2], "img": false, "cap": ""}, {"q": "For a given set of test-cases, which of the following is a benefit of running these tests with a test automation tool?", "o": ["Test coverage is increased", "The time spent on repetitive tasks is reduced", "The number of found bugs is reduced", "The total cost of the test project always decreases"], "a": [1], "img": false, "cap": ""}, {"q": "Which\nONE of the following options BEST describes the third test quadrant (3)?", "o": ["This test quadrant contains smoke tests and non-functional tests (except usability tests). These tests are often automated.", "This test quadrant is business-facing and criticizes the system. It contains exploratory testing, usability testing, and user acceptance testing.", "This test quadrant contains functional tests, examples, user story tests, user experience prototypes, API testing, and simulations. These tests check the acceptance criteria and can be manual or automated.", "This test quadrant is technology-facing and supports the team. These tests should be automated and included in the continuous integration (CI) process."], "a": [2], "img": false, "cap": ""}, {"q": "If you are using test results to learn more about the software and are then creating additional tests based on those results, what type of testing are you doing?", "o": ["Exploratory", "Decision-based", "Checklist-based", "Control flow"], "a": [0], "img": false, "cap": ""}, {"q": "A requirement specifies that if the total amount of sales (TAS) made during the year by a corporate seller is 300,000€ or more, the bonus that must be paid to the seller is 100% of a certain amount agreed upon at the beginning of the year. The software contains a fault as it implements this requirement with the decision “IF (TAS = 300,000)” instead of “IF (TAS ≥ 300,000)”. The application of the 3-value boundary value analysis to this problem consists of the following three test cases (TAS is an integer variable):\n\nTC1 = 299,999\nTC2 = 300,000\nTC3 = 300,001\n\nWhich of the following statements is TRUE?", "o": ["TC1 would highlight the fault.", "TC2 would highlight the fault.", "TC3 would highlight the fault.", "None of the three test cases would highlight the fault."], "a": [2], "img": false, "cap": ""}, {"q": "Exploratory testing is an experience-based test technique:", "o": ["Where a developer and a tester work together on the same workstation: while the developer actively writes code, the tester explores the code to find defects.", "That can be organized into sessions guided by test charters outlining test objectives that will guide the tester's exploration", "Where a team of testers explores all possible test techniques in order to determine the most suitable combination of these techniques to apply for test project", "That aims at finding defects by designing tests that exercise all possible combinations of input values and preconditions"], "a": [1], "img": false, "cap": ""}, {"q": "Which testing principle provides a good reason to base testing upon risk mitigation priorities?", "o": ["Testing shows the presence of defects", "Exhaustive testing is impossible", "Tests wear out", "Defects tend to cluster in a few modules"], "a": [1], "img": false, "cap": ""}, {"q": "Consider the following examples of risks identified in different software development projects:\n\n[I]. It may not be possible to generate the expected workloads to run performance tests, due to the poor hardware equipment of the machines (load injectors) that should generate these workloads.\n[I]I. A user’s session on a web application is not invalidated after a certain period of inactivity (configured by the system administrator) of the user.\n[III]. The test team will not have an adequate requirements specification (since many requirements will still be missing) by the time test design and analysis activities should begin according to the test plan.\n[IV]. Following a failure, the system is unable to continue to maintain its pre-failure operation and some data becomes corrupted.\n\nWhich of the following statements is TRUE?", "o": ["[II] and [IV] are product risks; [I] and [III] are project risks.", "[I] and [III] are product risks; [II] and [IV] are project risks.", "[I], [III], and [IV] are product risks; [II] is a project risk.", "[II] and [III] are project risks; [I] and [IV] are product risks."], "a": [0], "img": false, "cap": ""}, {"q": "Which ONE of the following statements is correct?", "o": ["Static analysis can be used against a work product containing unstructured artifacts", "There may be legal issues in performing static testing on a commercially available executable library", "Difficult to interpret work products are best tested using static analysis", "Test cases can be tested using static testing techniques but not the models"], "a": [1], "img": false, "cap": ""}, {"q": "When tests are being created to achieve statement coverage, what are they exercising?", "o": ["Only the decisions in the code", "Only the loops in the code", "Only the executable statements in the code", "All lines of code including executable statements and comments"], "a": [2], "img": false, "cap": ""}, {"q": "Calculate the measurement error SD for the following estimates done using three-point estimation technique:\n\nMost optimistic effort (a) = 120 person days\nMost likely effort (m) = 180 person days\nMost pessimistic effort (b) = 240 person days", "o": ["20", "120", "180", "197"], "a": [0], "img": false, "cap": ""}, {"q": "You are a functional tester, performing system testing of a flight reservation application.\nAfter logging into the system, you selected the \"New Reservation\" option on the main menu, and clicked the \"Submit\" button without making any changes to the default values on the screen.\nThe system charged your test credit card for $523.00 instead of the expected $1046.00.\nThis happens every time you execute the test case. You are entering a defect into your system, and submitting it to development for correction.\nYour defect report currently includes:\nThe date of the incident\nThe identity of the tester who discovered the incident\nThe steps executed to cause the incident, noting 100% reproducibility\nThe impact on the system and the priority of the defect\nThe expected and actual results\nWhat information is missing from this defect report?", "o": ["The test environment in which the test was executed", "Test case expected results", "The name of the developer who should have caught their error in unit testing", "Frequency of occurrence"], "a": [0], "img": false, "cap": ""}, {"q": "Which of the following statements correctly describe the business facing quadrant that supports the team?", "o": ["It is the quadrant that component testing.", "It is the quadrant that Non-functional testing such as performance and the tests are created on the basis of user scenarios.", "It is the quadrant that deals with tests created on the basis of user stories.", "Exploratory tests are generally used for this quadrant."], "a": [2], "img": false, "cap": ""}, {"q": "The Pareto principle states that a few causes are responsible for most effects.\n\nWhich test principle illustrates this phenomenon?", "o": ["Exhaustive testing is impossible", "Tests wear out", "Defects cluster together", "Early testing saves time and money"], "a": [2], "img": false, "cap": ""}, {"q": "In an Agile development model, the completion of testing or “done” is defined by which of the following?", "o": ["Project management", "Entry criteria", "Exit criteria", "The expected test completion date"], "a": [2], "img": false, "cap": ""}, {"q": "Which ONE of the following options CORRECTLY describes one of the seven principles of the testing process?", "o": ["The objective of testing is to implement exhaustive testing and execute as many test cases as possible.", "Exhaustive testing can only be carried out using behavior-based techniques.", "It is impossible to test all possible combinations of inputs and preconditions of a system.", "Automated testing enables exhaustive testing."], "a": [2], "img": false, "cap": ""}, {"q": "Which ONE of the following is a characteristic of exploratory testing?", "o": ["Testing without defined time-boxes", "Usually conducted when there is sufficient time for testing", "Test cases are written once the specifications become available", "Effectiveness depends on the individual testers’ skills"], "a": [3], "img": false, "cap": ""}, {"q": "Consider the following user story about an e-commerce website’s registration feature that only allows registered users to make purchases:\n\n“As a new user, I want to register to the website, so that I can start shopping online.”\n\nThe following are some of the acceptance criteria defined for the user story:\n\n[a] The registration form consists of the following fields: username, email address, first name, last name, date of birth, password and repeat password.\n[b] To submit the registration request, the new user must fill in all the fields of the registration form with valid values and must agree to the terms and conditions.\n[c] To be valid, the email address must not be provided by free online mail services that allow to create disposable email addresses. A dedicated error message must be presented to inform the new user when an invalid address is entered.\n[d] To be valid, the first name and last name must contain only alphabetic characters and must be between 2 and 80 characters long. A dedicated error message must be presented to inform the new user when an invalid first name and/or the last name is entered.\n[e] After submitting the registration request, the new user must receive an e-mail containing the confirmation link to the e-mail address specified in the registration form.\n\nBased only on the given information, which of the following ATDD tests is MOST LIKELY to be written first?", "o": ["The new user enters valid values in the fields of the registration form, except for the email address, where he/she enters an e-mail address provided by a free online mail service that allow to create disposable email addresses. Then he/she is informed by the website about this issue.", "The new user enters valid values in the fields of the registration form, except for the first name, where he/she enters a first name with 10 characters that contains a number. Then he/she is informed by the website about this issue.", "The user accesses the website with a username and password, and successfully places a purchase order for five items, paying by Mastercard credit card.", "The new user enters valid values in all the fields of the registration form, confirms to accept all the terms and conditions, submits the registration request and then receives an e-mail containing the confirmation link to the e-mail address specified in the registration form."], "a": [3], "img": false, "cap": ""}, {"q": "Which ONE of the following elements is TYPICALLY used to guide testing during exploratory testing?", "o": ["A test charter that defines the testing objectives for the test session.", "A comprehensive specification that must be fully available before testing begins.", "A detailed test script that prescribes all the steps to be performed.", "A predefined test case that must be executed exactly as documented."], "a": [0], "img": false, "cap": ""}, {"q": "A typical objective of testing is to:", "o": ["Determine the most appropriate level of detail with which to design test cases", "Verify the compliance of the test object with regulatory requirements", "Plan test activities in accordance with the existing test policy and test strategy", "Verify the correct creation and configuration of the test environment"], "a": [1], "img": false, "cap": ""}, {"q": "Which ONE of the following activities TYPICALLY belongs to the planning phase of the review process?", "o": ["A separate defect report is created for each identified defect so that corrective actions can be tracked.", "Each reviewer conducts an individual review to identify anomalies, recommendations, and questions.", "The purpose and scope of the review are defined, as well as the work product to be reviewed and the exit criteria.", "The reviewers analyze and discuss the anomalies found during the review in a joint meeting."], "a": [2], "img": false, "cap": ""}, {"q": "Consider the following test-related items (1, 2, 3, 4) and four testing quadrants(Q1, Q2, Q3, Q4):\n\n1. Security tests\n2. Examples\n3. Component integration tests\n4. Exploratory tests\n\nQ1: technology facing, supporting the development team\nQ2: business facing, supporting the development team\nQ3: business facing, critique the product\nQ4: technology facing, critique the product\n\nHow do the specified test-related items map onto the four testing quadrants?", "o": ["1–Q3, 2–Q2, 3–Q1, 4–Q4", "1–Q4, 2–Q2, 3–Q1, 4–Q3", "1–Q1, 2–Q2, 3–Q3, 4–Q4", "1–Q4, 2–Q1, 3–Q2, 4–Q3"], "a": [1], "img": false, "cap": ""}, {"q": "Which of the following is supported by good information traceability?", "o": ["Portability of test automation code", "Understandability of test reports", "Dependability of test environments", "Stability of the system under test"], "a": [1], "img": false, "cap": ""}, {"q": "Which ONE of the following options MOST ACCURATELY describes the activities of “testing” and “debugging”?", "o": ["Testing triggers a failure that is caused by a defect in the software, whereas debugging is concerned with finding the causes of this failure (defects), analyzing these causes, and eliminating them.", "Testing triggers a failure that is caused by a defect in the software, whereas debugging is concerned with finding the causes of this failure (defects), analyzing these causes, and reproducing them.", "Testing identifies a defect that is caused by an error in the software, whereas debugging is concerned with finding the causes of this defect, analyzing these causes, and eliminating them.", "Testing triggers a defect that is caused by an error in the software, whereas debugging is concerned with finding the causes of this defect, analyzing y of the product they develop."], "a": [2], "img": false, "cap": ""}, {"q": "Your organization’s test strategy states that it is desirable to use more than one method for estimating the test effort. You are responsible for establishing the test effort for the next project. Based on historical information, the type of project you are going to estimate has a development-to-test effort ratio of 5:3.\n\nThe initial estimate of the development effort is 450 person-days.\n\nWhich ONE of the following options corresponds to the estimated test effort using the ratio-based method?", "o": ["750 person-days", "180 person-days", "720 person-days", "270 person-days"], "a": [3], "img": false, "cap": ""}, {"q": "Which ONE of the following options MOST ACCURATELY describes statement testing?", "o": ["In statement testing, the coverage items are control flow transfers between branches. The aim is to design test cases to exercise branches in the code until an acceptable level of coverage is achieved, expressed as a percentage.", "In statement testing, the coverage items are decisions and statements. The aim is to design test cases that exercise statements in the code until an acceptable level of coverage is achieved, expressed as a percentage.", "In statement testing, the coverage items are branches, and the aim is to design test cases to exercise branches in the code until an acceptable level of coverage is achieved, expressed as a percentage.", "In statement testing, the coverage items are executable statements. The aim is to design test cases that exercise statements in the code until an acceptable level of coverage is achieved, expressed as a percentage."], "a": [3], "img": false, "cap": ""}, {"q": "Which of the following is a correct statement regarding Quadrant Q2 of the testing quadrants?", "o": ["It is technology facing, supports the team, and contains component and component integration tests", "It is business facing, critiques the product, and contains exploratory and usability testing", "It is technology facing, critiques the product, and contains the smoke tests and performance tests", "It is business facing, supports the team, and contains functional tests and API tests"], "a": [3], "img": false, "cap": ""}, {"q": "Which\nONE of the following elements is TYPICALLY NOT part of a test progress\nreport?", "o": ["Obstacles and their workarounds", "A detailed assessment of product quality", "Test metrics to show the current status of the test process", "New or changed risks"], "a": [1], "img": false, "cap": ""}, {"q": "Which is a key function of a test management tool?", "o": ["Facilitates management and control of testing activities", "Generates test data based on test management criteria", "Generates detailed test specifications based on the test plan", "Analyzes and enforces coding and testing standards"], "a": [0], "img": false, "cap": ""}, {"q": "Which of the following is a good testing practice that applies regardless of the specific software development lifecycle being used?", "o": ["Prompt and prepared attendance to stand-up meetings", "Step-by-step test case documentation", "Ensuring there is a corresponding testing activity for every software development activity", "Involving the stakeholders in reviewing all acceptance criteria prior to designing test cases"], "a": [2], "img": false, "cap": ""}, {"q": "Shripriya is defining the guidelines for the review process implementation in her company. Which of the following statements is LEAST likely to have been recommended by her?", "o": ["Review initiation is the stage when the review team starts the discussion on the review comments", "Independent of the size of the work products, planning for the review should be performed", "Large sized work products should be reviewed in one go because you will have to spend too much time if you split it into multiple reviews", "Defect reports should be created for every review found"], "a": [2], "img": false, "cap": ""}, {"q": "An organization rder", "Moderator"], "a": [2], "img": false, "cap": ""}, {"q": "You are using boundary value analysis to determine your test data.\nWhat values should you use to test a routine that requires an integer input (x) to be greater than zero and less than 100 to achieve 100% minimum coverage using the two-point boundary value analysis technique?", "o": ["0, 100", "–1, 1, 99, 101", "0, 1, 99, 100", "–1, 0, 1, 99, 100, 101"], "a": [1], "img": false, "cap": ""}, {"q": "Which of the following is a methodical approach to error guessing?", "o": ["Create a list of possible failures and defects and design tests to address each one", "Ask the developers where the likely errors will be and discuss how to test for each one", "Review the code to determine areas of high complexity and target those areas with tests", "Determine all the decisions in the code and design tests to address each one"], "a": [0], "img": false, "cap": ""}, {"q": "What is a reasonable way to control and minimize the cost of testing and development?", "o": ["Conduct formal reviews to detect defects as early as possible", "Perform a usability analysis prior to user interface design", "Automate error detection at the beginning of acceptance testing", "Hire low-cost, outsourced testing staff for system testing"], "a": [0], "img": false, "cap": ""}, {"q": "An anti-intrusion system is battery powered and is activated by pressing the only available button. To deactivate the system, the operator must enter a PIN code. The system will stay in alert mode within a configurable timeout and an alarm bell will ring if the system is not deactivated before the timeout expires. The following state transition diagram describes the behavior of the system.", "o": ["“Inactive”, [Press Button], “Active”, [Sensor Activated], “Alert Mode”, [Timeout expired], “Alarm bell rings”", "“Inactive”, [Enter PIN], “Active”, [Sensor Activated], “Alert Mode”, [Timeout expired], “Alarm bell rings”", "“Inactive”, [Press Button], “Active”, [Press Button], “Active”, [Sensor Activated], “Alert Mode”, [Timeout expired], “Alarm bell rings”", "“Inactive”, [Press Button], “Active”, [Sensor Activated], “Alert Mode”, [Press Button], “Alert Mode”, [Timeout expired], “Alarm bell rings”"], "a": [0], "img": true, "cap": "Assume that each test case has the following form, in which states are indicated in quotation marks and transitions in square brackets: \"State 1\", [Transition 1], \"State 2\", [Transition 2], ..., \"State N-1\", [Transition N-1], \"State N\".\n\nWhich of the following test cases, in addition to being valid, covers all states with minimal effort?"}, {"q": "The following decision table is an excerpt of a larger decision table used to assist a doctor in determining the drug therapy to prescribe for a patient (aged 6 to 65 years) diagnosed with acute sinusitis. The table consists of four Boolean conditions and six actions:", "o": ["7", "1", "8", "3"], "a": [2], "img": true, "cap": "Based only on the given infomation, which of the following represent an impossible situation?"}, {"q": "Pariksha Labs is a mature software testing company. They are  TMMi level 5 certified. Their testing processes are well defined. Which ONE of the following statements is likely to be CORRECT about them?", "o": ["They try to perform 100% automation for every project because automation is a must for efficiency.", "Same set of testing processes are used by them without needing any tweaks.", "The company uses same test strategy for all projects with minor changes.", "The question about test design techniques to be used is determined based on domain and stakeholder expectations."], "a": [3], "img": false, "cap": ""}, {"q": "Which of the following is NOT an example of a test-first approach to development?", "o": ["Acceptance Test-Driven Development", "Test Coverage-Driven Development", "Behavior-Driven Development", "Test-Driven Development"], "a": [1], "img": false, "cap": ""}, {"q": "Which of the following statements about static testing and dynamic testing is TRUE?", "o": ["Static testing is better suited than dynamic testing for highlighting issues that could indicate inappropriate code modularization.", "Dynamic testing can only be applied to executable work products, while static testing can only be applied to non-executable work products.", "Both dynamic testing and static testing cause failures, but failures caused by static testing are usually easier and cheaper to analyze.", "Security vulnerabilities can only be detected when the software is being executed, and thus they can only be detected through dynamic testing, not through static testing."], "a": [0], "img": false, "cap": ""}, {"q": "Consider\ntwo situations:\n\n(1) A code statement is \"return x*y + z\", but\nshould be \"return x*(y+z)\".\n(2) For the input x=2, y=3, z=4 the\nsystem returns 10, but should return 14.\n\nWhich of the following is TRUE?", "o": ["Both (1) and (2) are defects", "(1) is an error, (2) is a failure", "(1) is a defect, (2) is a failure", "Both (1) and (2) are errors"], "a": [2], "img": false, "cap": ""}, {"q": "Which of the following is LEAST likely to describe a task performed by someone in a testing role?", "o": ["Evaluate test basis and test object", "Create test completion report", "Define test environment requirements", "Assess testability of test object"], "a": [2], "img": false, "cap": ""}, {"q": "Consider the following defect report for an Exam Booking System.\n\nDefect ID: ST1041 | Title: Unable to cancel an exam booking | Severity: Very High | Priority: Very High | Environment: Windows 10, Firefox\n\nDescription: When attempting to cancel an exam booking using the cancel exam feature, the system does not cancel the exam even though it shows a message that the exam has been cancelled.\n\nWhich ONE of the following indicates the information that should be added to the description for reproducing the defect easily?", "o": ["Repeating the test case with different browsers and logging a separate defect for each one of them.", "The defect id used is alphanumeric in nature. It should be a number only.", "Providing better severity and priority. It is not clear why this is a high severity problem as the exams can be booked without any problem.", "Providing exact steps that lead to this defect. It is not clear from the description if this is a problem for any scheduled exam or for a specific user."], "a": [3], "img": false, "cap": ""}, {"q": "Which of the following correctly represents a test first approach?", "o": ["Tests are derived from acceptance criteria and run to check that the code passes these tests", "Application behaviour is written in Given/When/Then format and tests are then written and run", "First the tests fail then the code is written to pass the tests and this is iterated", "Code is refactored first then tests are written and run"], "a": [2], "img": false, "cap": ""}, {"q": "A functional requirement states that pressure values must always be positive and stay within a range of 100 to 200 pounds for a particular tank (100 and 200 are valid within the range).\nWhich of the following is the minimum set of values that would achieve coverage using the equivalence partitioning technique?", "o": ["A series of tests where pressure is set to 98, 110, and 201 pounds", "A series of tests where pressure is set to 98, 100, and 200 pounds", "A series of tests where pressure is set to 100, 110, and 200 pounds", "A series of tests where pressure is set to –1, 0, 175, and 297 pounds"], "a": [0], "img": false, "cap": ""}, {"q": "Given the following requirement:\nThe system shall compute the car’s position using the following equation:\nnew_distance_traveled + old_position\nWhich type of testing should be implemented to help ensure this requirement is met?", "o": ["Functional", "Reliability", "Performance", "Maintainability"], "a": [0], "img": false, "cap": ""}, {"q": "Which ONE of the following options corresponds to an activity in the testing process in which testable features are identified?", "o": ["Test design", "Test analysis", "Test implementation", "Test execution"], "a": [1], "img": false, "cap": ""}, {"q": "In the testing quadrants model, which testing is business-facing and supports the team?", "o": ["Security testing", "Component testing", "API testing", "Exploratory testing"], "a": [3], "img": false, "cap": ""}, {"q": "Which of the following is a technique that can be used to develop user stories in collaboration with the developers and business?", "o": ["DevOps", "CI/CD", "Brainstorming", "Equivalence Partitioning"], "a": [2], "img": false, "cap": ""}, {"q": "Which of the following is a good testing practice which is applicable INDEPENDENT of the software development lifecycle followed?", "o": ["Not all development activities should have corresponding test activities", "Large amount of redundancy between test levels is good because it prevents bug leakage", "Reviews should be done after the work products have been finalized", "Each test level should have an appropriate test objective"], "a": [3], "img": false, "cap": ""}, {"q": "You are a tester working on a critical project. Based on the risk analysis you need to decide on the order of test execution. Which of the following lists the correct sequence of test execution? Priority 1 is the highest and Priority 3 is the lowest priority", "o": ["D–C–B–A", "C–B–A–D", "D–A–B–C", "D–B–A–C"], "a": [3], "img": true, "cap": ""}, {"q": "Which of the following examples represents System Integration testing?", "o": ["Testing the system based on specifications using simulator for a sub-system", "Testing an application in development environment which is similar to the production environment", "Testing an application's behaviour to check if it fulfils business needs", "Testing if e-commerce website works correctly with a third-party payment gateway"], "a": [3], "img": false, "cap": ""}, {"q": "Which ONE of the following statements about the objectives of confirmation and regression testing is the BEST?", "o": ["The purpose of confirmation testing is to confirm that the defect giving rise to a failure has been successfully fixed. The regression test aims to ensure that no defects have been introduced or discovered in unmodified areas of the software as a result of the changes made.", "The purpose of confirmation testing is to confirm that the defect giving rise to a failure has been satisfactorily fixed. The regression test aims to ensure that no defects have been introduced or discovered in modified areas of the software as a result of the changes made.", "Confirmation testing aims to confirm that the observed failure is not a false positive. The regression test aims to ensure that no defects have been introduced or discovered in unmodified areas of the software as a result of the changes made.", "The purpose of regression testing is to confirm that the defect giving rise to a failure has been satisfactorily resolved. The purpose of the confirmation testing is to ensure that no defects have been introduced or discovered in unmodified areas of the software as a result of the changes made."], "a": [0], "img": false, "cap": ""}, {"q": "Which tools support delivery pipelines, automated build processes, and practices such as Continuous Integration/Continuous Delivery?", "o": ["Collaboration tools", "Test design and test implementation tools", "Test management tools", "DevOps tools"], "a": [3], "img": false, "cap": ""}, {"q": "Which of the following statements is CORRECT?", "o": ["Testing based on the structure of the software under test (SUT) is white-box testing whereas testing the input-output behaviour without pre-written test cases is experience based testing.", "Testing the software under test (SUT) based on the design is black-box testing whereas testing the input-output behaviour is experience based testing.", "Testing the software under test (SUT) is possible only after implementation in white-box testing whereas testing the software even before implementation is possible in exploratory testing.", "Testing the software under test (SUT) using knowledge of the tester is experience based testing whereas testing the specification based behaviour without pre-written test cases is using black-box testing techniques."], "a": [0], "img": false, "cap": ""}, {"q": "The development team is finalizing the design of a database schema for a banking application. Before implementation, architects want to get a consensus among team members on the details of this scheme.\n\nWhich type of review fits this scenario BEST?", "o": ["Informal review", "Technical review", "Inspection", "Static analysis"], "a": [1], "img": false, "cap": ""}, {"q": "Scenario “Happy Tomatoes”\n\nAn intelligent application for agricultural use incorporates temperature sensors located at different points of an enclosure. The sensors measure and record the temperature at regular intervals and extract the statistical values for these measurements. These values include the average daily temperature.\n\nA new variety of tomatoes is currently being grown and the “World Organization for Happy Tomatoes” has established temperature ranges related to vegetative development.\n\nWhen the system establishes that the average temperature is within a specific range, it emits a value that will be used to monitor and control the crop.", "o": ["Identification of the test object and test environment", "A concise title and a short summary of the defect being reported", "Description of the structure of the test team", "Expected results and actual results"], "a": [2], "img": true, "cap": "When running test case TC_59 the actual result for t = 35 degrees Celsius is OUTPUT = X. Which information should NOT be included in the defect report?"}, {"q": "From a testing perspective, configuration management:", "o": ["Allows the expected results to be compared with the actual results.", "Allows the tracking of all changes to versions of the testware.", "Includes all activities that direct and control an organization with regard to quality.", "Focuses on configuring static analysis tools to choose the most suitable breadth and depth of analysis."], "a": [1], "img": false, "cap": ""}, {"q": "Which approach BEST improves team dynamics, enhances communication, and creates synergy by allowing the various skill sets within the team to be leveraged for the benefit of the project?", "o": ["Collaboration-based test approach", "Whole team approach", "Exploratory testing", "Test-first approach"], "a": [1], "img": false, "cap": ""}, {"q": "Which of the following is the main difference between quality assurance (QA) and quality control (QC)?", "o": ["QA is the responsibility of everyone on a project while QC is the responsibility of a dedicated team", "QA is a process-oriented approach, while QC is a product-oriented approach", "QA is preventive while QC is corrective", "QA is focused on implementation, while QC is focused on improvement"], "a": [1], "img": false, "cap": ""}, {"q": "You prepared the following defect report.\n\nDefect ID: DR-00123 Date: 2025-01-12\nTitle: \"Order Confirmation\" button not responsive after adding items to the cart\nSeverity: High Priority: Critical Reported By: John Doe\n\nSteps to reproduce:\n1. Launch the app and log in.\n2. Browse the menu and add items to the cart.\n3. Navigate to the cart and tap the “Order Confirmation” button.\n\nExpected result: The “Order Confirmation” button should process the order and navigate to the confirmation screen.\n\nActual result: The “Order Confirmation” button is unresponsive, and no action is taken.\n\nAttachments: Screenshot: [order_button_issue.png], Video: [order_button_issue.mp4]\n\nWhich of the following is the BEST way to improve this report to help developers resolve the reported problem?", "o": ["Add expected results after each step in the “steps to reproduce” section", "Add environment data and link to the test case that caused the failure", "Reduce severity and priority levels", "Add a suggestion how a source code could be chanced to fix the underlying defect"], "a": [1], "img": false, "cap": ""}, {"q": "If a developer is analyzing a failure to determine the cause, he is engaging in what type of activity?", "o": ["Testing", "Design and Analysis", "Debugging", "Configuration management"], "a": [2], "img": false, "cap": ""}, {"q": "In addition to thorough testing of the requirements specification, a development team aims to involve users as early as possible in the development process, using practices such as prototyping, to ensure that the software systems being developed will meet the users’ expectations. This approach is especially useful at mitigating the risks associated with which one of the seven testing principles, which one?", "o": ["Tests wear out", "Absence-of-errors fallacy", "Working software over comprehensive documentation.", "Defects cluster together."], "a": [1], "img": false, "cap": ""}, {"q": "Which of the following should you review using static testing?", "o": ["Memory leak during execution", "Performance of a module under load", "Interactive output from a debugger", "Test plan"], "a": [3], "img": false, "cap": ""}, {"q": "Which of the following is a benefit of early stakeholder feedback?", "o": ["It can be gathered early and then used to make changes after the product goes to production to make it more user friendly", "It allows the project manager to get a better view of the changes that will be needed for the next version", "The developers get a better understanding of what they are building", "The testers get a better understanding of the test automation requirements"], "a": [2], "img": false, "cap": ""}, {"q": "Which of the following types of bug are more likely to be found by static testing then by dynamic testing?", "o": ["Variables that were declared in the code without initialization", "Functions that take much longer time to complete than expected", "Crashes of the application", "A sub-system that does not perform the intended functionality"], "a": [0], "img": false, "cap": ""}, {"q": "A developer assumed users would always filter items by category to narrow their search. However, a tester conducted usability testing and found that most users prefer using the search bar instead, highlighting a potential gap in the user interface design.\n\nWhich practice allowed the benefit described in the scenario to be achieved?", "o": ["Shift left", "Independence of testing", "Confirmation testing", "Retrospectives"], "a": [0], "img": false, "cap": ""}, {"q": "After being in operation for many years, a document management system must be decommissioned as it has reached its end of life. This system will not be replaced by any other new system. A legal obligation provides that all documents within the system must be kept for at least 20 years in a state archive. Which of the following statements about maintenance testing for decommissioning of this system is TRUE?", "o": ["No maintenance testing is required as this system will not be replaced.", "Data migration testing is required as part of maintenance testing.", "Confirmation testing is required as part of maintenance testing.", "Regression testing is required as part of maintenance testing."], "a": [1], "img": false, "cap": ""}, {"q": "Which of the following statements about traceability is FALSE?", "o": ["Traceability between test basis items and the test cases designed to cover them makes it possible to determine which test basis items have been covered by the executed test cases.", "Traceability between test basis items and the test cases designed to cover them enables experience-based test techniques to be applied.", "Traceability between test basis items and the test cases designed to cover them enables identification of which test cases will be affected by changes to the test basis items.", "Traceability can be established and maintained through all the test documentation for a given test level, such as from test conditions through test cases to test scripts."], "a": [1], "img": false, "cap": ""}, {"q": "Which of the following statements about static and dynamic testing is TRUE?", "o": ["Static testing can detect that a component has too many lines of code; dynamic testing can force a component to return the wrong result", "Static testing can force a component to return the wrong result; dynamic testing can force a component to return the correct result", "Static testing can demonstrate that software fails when given specific input data; dynamic testing finds defects directly", "Static testing can be performed at all test levels; dynamic testing can be performed only at system, system integration, and acceptance test levels"], "a": [0], "img": false, "cap": ""}, {"q": "If:\n\nEC = number of exercised conditional branches in a code;\nEU = number of exercised unconditional branches;\nC = number of conditional branches;\nU = number of unconditional branches.\n\nWhich metric correctly defines the branch coverage?", "o": ["EC/C + EU/U", "(EC + EU) / (C + U)", "EC/C", "EC + EU"], "a": [1], "img": false, "cap": ""}, {"q": "Match the Work Product with the category it belongs to:\n\nWork Product:\n1. Risk register\n2. Risk information\n3. Test cases\n4. Test conditions\n\nCategory of work products:\nA) Test planning work products\nB) Test analysis work products\nC) Test design work products\nD) Test monitoring and control work products", "o": ["1-A, 2-C, 3-B, 4-D", "1-C, 2-A, 3-D, 4-B", "1-B, 2-D, 3-A, 4-C", "1-A, 2-D, 3-C, 4-B"], "a": [3], "img": false, "cap": ""}, {"q": "The customer reported the software failure in the form of a defect report, providing the version number of the software they use. Based on this information, the team identified the files used to build this version and the elements of the environment in which this version was created. This made it possible to identify and fix the defect quickly.\n\nWhat process enabled the above actions?", "o": ["Defect management", "Configuration management", "Test automation", "Test estimation"], "a": [1], "img": false, "cap": ""}, {"q": "Which ONE of the following options is a PRODUCT risk and NOT a PROJECT risk?", "o": ["Incorrect calculation logic in the software, leading to inaccurate results.", "Poor communication between team members, making project management more difficult.", "Staff shortages in the project leading to scheduling problems.", "Delays in the delivery of work products by the project team."], "a": [0], "img": false, "cap": ""}, {"q": "A test status report SHOULD:", "o": ["Specify the impediments to carrying out the planned test activities in the reporting period and the corresponding solutions put in place to remove them.", "Be produced as part of test completion activities and report unmitigated product risks to support the decision whether or not to release the product.", "Always be based on the same template within an organization, as its structure and contents should not be affected by the audience to which the report is presented.", "Specify the lines of communication between testing, other lifecycle activities, and within the organization that were chosen at the outset of the test project."], "a": [0], "img": false, "cap": ""}, {"q": "When is the detailed risk analysis for a story first conducted?", "o": ["Project planning", "Iteration planning", "Release planning", "Epic planning"], "a": [1], "img": false, "cap": ""}, {"q": "You are a test manager responsible for implementing risk-based testing in your organization which deals with software in the healthcare domain. You are writing a handbook of various product risk mitigation options. Which ONE of the following options correctly represent the correct mitigation options?", "o": ["Choosing a tool for automated unit testing to reduce test design effort", "Using a third-party testing company to identify the causes of failures", "Selecting a tester with required knowledge to execute security testing", "Increasing the number of testers to reduce total test duration"], "a": [2], "img": false, "cap": ""}, {"q": "Which\nONE of the following is a GOOD testing practice that is INDEPENDENT of the\nchosen SDLC (Software Development Life Cycle) model?", "o": ["Testers are involved in reviewing work products as soon as the final version of this documentation is available so that this earlier testing and defect detection can support the “shift-left” strategy.", "Test analysis and design for a specific test level begin during the corresponding development phase of the SDLC, allowing testing to follow the principle of late testing.", "For every software development activity, there is a corresponding testing activity, ensuring that all development activities are subject to quality assurance.", "Different test levels have specific and overlapping test objectives, allowing tests to be appropriate to specific test object types while managing redundancy."], "a": [3], "img": false, "cap": ""}, {"q": "During which activity in the review process are the quality characteristics selected for evaluation?", "o": ["Initiating", "Planning", "Analysis", "Fixing"], "a": [1], "img": false, "cap": ""}, {"q": "You validate the correctness of price calculation in a food ordering application. The input parameter is the order amount (in $), and the result is the final price reflecting the discount. If the order amount is less than $100, the discount is not granted (0% discount). If the order amount is greater than $500, a 50% discount is granted. In other cases, the 10% discount is granted.\nYou apply equivalence partitioning for the \"order amount\" domain to check if discounts are granted correctly.\nWhich test data set achieves the highest coverage?", "o": ["100.01, 499.99, 500.01", "50.99, 500, 500.10", "99.99, 100, 500", "0, 10, 50"], "a": [2], "img": false, "cap": ""}, {"q": "Which of the following statements about the typical activities of a formal review process is TRUE?", "o": ["Individual review is only mandatory when the size of the work product under review is too large to cover at the review meeting.", "Various review techniques that may be applied by participants during individual review are described in the ISO/IEC/IEEE 29119-3 standard.", "Choosing which standards to follow during the review process is usually made during review planning.", "One of the main goals of the review meeting is to make sure that all participants are aware of their roles and responsibilities in the review process."], "a": [2], "img": false, "cap": ""}, {"q": "Which of the following statements is TRUE?", "o": ["Unlike functional testing, non-functional testing can only be applied to conventional systems, not artificial intelligence-based system.", "Functional testing focuses on what the system is supposed to do, while white-box testing focuses on how well the system does what it is supposed to do.", "Functional testing can be applied to all test levels, while non-functional testing can be applied only to system and acceptance test levels.", "Black-box test techniques and experience-based test techniques may be applicable to both functional testing and non-functional testing."], "a": [3], "img": false, "cap": ""}, {"q": "Which of the following is TRUE about exploratory testing?", "o": ["It is more effective when a tester is less experienced and has no domain knowledge", "It uses test results to learn more about the test object and create more focused tests", "It allows the use of experience-based test techniques but not black-box test techniques", "It focuses not only on defect detection but also on defect avoidance through collaboration"], "a": [1], "img": false, "cap": ""}, {"q": "You are working on calculating the estimation for a project. You have been given the following numbers by your manager, who is considered to be an expert in estimation:\nOptimistic = 35 days\nLikely = 40 days\nPessimistic = 65 days\nApply the three-point estimation technique, what is the proper expression of
